<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    .favicon-shape {
      stroke: #047857;
      transition: stroke 0.2s ease;
    }
    /* Dark Mode Support for Browsers */
    @media (prefers-color-scheme: dark) {
      .favicon-shape {
        stroke: #10b981; /* Lighter emerald green for dark mode contrast */
      }
    }
  </style>
  
  <!-- Centered Oval Shape (Fills Square Canvas Cleanly) -->
  <rect 
    class="favicon-shape" 
    x="20" 
    y="60" 
    width="160" 
    height="80" 
    rx="40" 
    ry="40" 
    fill="none" 
    stroke-width="20" 
  />
</svg>
